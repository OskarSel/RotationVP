<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Rotation</title>
  <meta name="description" content="Create a Rotation account to save your volleyball learning progress.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="auth-shell" id="main">
    <div class="auth-side">
      <div class="auth-side__content">
        <svg viewBox="0 0 30 30" fill="none" width="34" aria-hidden="true" style="margin-bottom: var(--sp-6);">
          <circle cx="15" cy="15" r="12.5" stroke="#E8A33D" stroke-width="2"/>
          <path d="M15 2.5c-5 4-5 21 0 25M4 10.5c5 3 17 3 22 0M4 19.5c5-3 17-3 22 0" stroke="#E8A33D" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <h2 style="max-width: 16ch;">Start understanding every rotation.</h2>
        <p style="color: rgba(239,238,234,0.72); margin-top: var(--sp-4); max-width: 34ch;">Create an account to keep your XP, level and completed lessons.</p>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-card">
        <a href="index.html" class="auth-card__brand">
          <svg viewBox="0 0 30 30" fill="none" width="26" aria-hidden="true">
            <circle cx="15" cy="15" r="12.5" stroke="#E8A33D" stroke-width="2"/>
            <path d="M15 2.5c-5 4-5 21 0 25M4 10.5c5 3 17 3 22 0M4 19.5c5-3 17-3 22 0" stroke="#E8A33D" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          Rotation
        </a>

        <h1 style="font-size: var(--fs-600); margin-bottom: var(--sp-2);">Create account</h1>
        <p class="text-muted" style="margin-bottom: var(--sp-7);">It takes less than a minute.</p>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="register-name">Username</label>
            <input type="text" id="register-name" name="name" autocomplete="nickname" required>
          </div>
          <div class="field">
            <label for="register-email">Email address</label>
            <input type="email" id="register-email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" name="password" autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn btn--dark btn--full">Create account</button>
        </form>

        <div class="auth-divider">or</div>
        <a href="learn.html" class="btn btn--ghost btn--full">Continue without an account</a>

        <p class="auth-footer-link">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script>
    // No real authentication at this stage — we only save the username
    // locally so the profile has something to display.
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('register-name').value.trim();
      if (name) ProgressStore.setUsername(name);
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
